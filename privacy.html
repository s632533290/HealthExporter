const ALIASES = { "zh": "zh-Hans", "zh-cn": "zh-Hans", "zh-tw": "zh-Hant", "zh-hk": "zh-Hant", "pt": "pt-BR", "en-us": "en", "en-gb": "en", "en-au": "en", "en-ca": "en", "fr-fr": "fr", "fr-ca": "fr", "de-de": "de", "es-es": "es", "es-mx": "es" };

function resolve(code) {
  if (!code) return null;
  const lower = code.toLowerCase();
  for (const key of Object.keys(T)) if (key.toLowerCase() === lower) return key;
  if (ALIASES[lower]) return ALIASES[lower];
  const base = lower.split("-")[0];
  if (base === "zh") return /hant|tw|hk|mo/.test(lower) ? "zh-Hant" : "zh-Hans";
  return T[base] ? base : (ALIASES[base] || null);
}

function el(tag, text) { const n = document.createElement(tag); n.textContent = text; return n; }

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title + " · HealthExport Local";
  document.getElementById("title").textContent = t.title;
  document.getElementById("meta").textContent = t.meta;
  const content = document.getElementById("content");
  content.replaceChildren();
  for (const [heading, paras] of t.s) {
    const sec = document.createElement("section");
    sec.appendChild(el("h2", heading));
    const bullets = paras.filter(p => p.startsWith("•") || p.startsWith("・"));
    paras.filter(p => !bullets.includes(p)).forEach(p => sec.appendChild(el("p", p)));
    if (bullets.length) {
      const ul = document.createElement("ul");
      bullets.forEach(b => ul.appendChild(el("li", b.replace(/^[•・]\s*/, ""))));
      sec.appendChild(ul);
    }
    content.appendChild(sec);
  }
  const nav = document.getElementById("langs");
  nav.replaceChildren();
  for (const [code, name] of LANGS) {
    const a = el("a", name);
    a.href = "?lang=" + code;
    a.hreflang = code;
    if (code === lang) a.setAttribute("aria-current", "true");
    nav.appendChild(a);
  }
}

const param = new URLSearchParams(location.search).get("lang");
const lang = resolve(param) || (navigator.languages || [navigator.language]).map(resolve).find(Boolean) || "en";
render(lang);
</script>
